project:
  title: "AXIS prompt Pareto-improvement search"
  question: "Which prompt design can improve MC, OE, and TF without sacrificing any task family on the released AXIS checkpoint?"
  status: active
  started: "2026-07-26"
  domain: "time-series QA prompt optimization and LLM evaluation"

evaluation:
  released_checkpoint_only: true
  formal_judge: "deepseek-v4-pro"
  locked_reference_set: "paper140"
  locked_reference_counts:
    multiple_choice: 43
    open_ended: 55
    true_false: 42
  success_criterion: "On paper140, all ten Table-I metrics must be no lower than the locked Baseline under deepseek-v4-pro; prefer candidates that improve all ten."
  prompt_search_space: "All prompt-only changes are allowed, including question-type-conditioned rules."
  selection_set: "24 QA / 12 series from the 144 non-paper140 QA, series-disjoint from validation and holdout"
  validation_set: "72 QA / 36 series from the 144 non-paper140 QA"
  confirmatory_set: "48 QA / 24 series from the 144 non-paper140 QA; touched only after validation selection"
  final_test_policy: "paper140 is touched once after a single prompt is locked from the internal holdout"

hypotheses:
  - id: H1
    statement: "The old full Evidence Contract improves OE by eliciting explicit evidence coverage, but hurts MC/TF through instruction competition and the false 'same row' alignment claim."
    status: active
    motivation: "OE rises in every dimension while MC/TF decline relative to fixed-role-only."
    priority: high
  - id: H2
    statement: "The revised scaling/alignment wording removes some MC/TF errors but over-activates numeric decoding and harms OE relevance/accuracy."
    status: active
    motivation: "Revised-vs-old restores MC/TF but loses all OE dimensions."
    priority: high
  - id: H3
    statement: "A single long common contract cannot Pareto-improve all task families; short shared evidence semantics plus task-conditioned response instructions can."
    status: active
    motivation: "Observed task-family trade-offs suggest different instruction bottlenecks."
    priority: high
  - id: H4
    statement: "Separating evidence interpretation from response format, and making numerical rescaling conditional only for numeric OE questions, will reduce cross-task interference."
    status: pending
    motivation: "The current contract mixes representation semantics, anomaly definition, and answer behavior."
    priority: medium

experiments:
  proxy_metric: "Lexicographic: number of nonnegative Table-I dimensions, minimum dimension delta, then mean of the ten deltas versus Baseline"
  baseline_value:
    mc_final: 4.255815217345678
    oe_final: 3.085930669870713
    tf_final: 3.642142370108918
    macro_final: 3.661296085775103
  best_value:
    split: screening
    mode: pareto_p01_boundary
    nonnegative_dimensions: 9
    worst_delta: -0.28571198067779013
    mean_delta: 0.2526346384750413
  total_runs: 25
  trajectory:
    - round: screening_round_1
      modes: 13
      predictions: 312
      judge_scores: 715
      audit_ok: true
      winner: pareto_p01_boundary
      winner_nonnegative_dimensions: 9
      winner_worst_delta: -0.28571198067779013
      winner_mean_delta: 0.2526346384750413
    - round: validation_round_1
      modes: 6
      predictions: 432
      judge_scores: 996
      audit_ok: true
      gate_passed: false
      winner: pareto_p07_abd
      winner_nonnegative_dimensions: 7
      winner_worst_delta: -0.457
      winner_mean_delta: 0.128
      holdout_touched: false
    - round: development_round_2
      modes: 6
      predictions: 576
      judge_scores: 1326
      audit_ok: true
      gate_passed: false
      winner: route_r2_04_oe_old_contract
      winner_nonnegative_dimensions: 7
      winner_worst_delta: -0.38103402416788823
      winner_mean_delta: 0.20529373031711926
      holdout_touched: false

outer_loop:
  cycle: 4
  last_direction: deepen
  last_reflection: "Round 2 validated task routing for MC and TF but isolated OE as the bottleneck. Negative OE constraints prime forbidden phrases, while long coverage rules change diagnoses and invite unsupported numeric or out-of-window claims. Round 3 preserves audited byte-identical components, adds two conservative Baseline-OE/TF controls, and tests short positive qualitative OE obligations; holdout remains untouched."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  experiments_dir: "experiments/"
  failure_case_protocol: "experiments/failure-case-audit/protocol.md"
  parent_report: "../prompt_stage_a_deepseek_v4_pro_20260725/Prompt_Stage_A_消融实验结果分析.md"
